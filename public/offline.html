<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Sandesh Arsud Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1C1C27 0%, #0a0a0f 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(133, 76, 230, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #854CE6 0%, #b47bff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 24px;
    }

    .retry-button {
      display: inline-block;
      padding: 12px 32px;
      background: #854CE6;
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 15px rgba(133, 76, 230, 0.4);
    }

    .retry-button:hover {
      background: #6f3bb8;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(133, 76, 230, 0.6);
    }

    .features {
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .features h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: rgba(255, 255, 255, 0.9);
    }

    .feature-list {
      text-align: left;
      display: inline-block;
    }

    .feature-list li {
      padding: 8px 0;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }

    .feature-list li::before {
      content: "✓ ";
      color: #854CE6;
      font-weight: bold;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. Don't worry, you can still view
      cached pages from your previous visits!
    </p>
    <button class="retry-button" onclick="window.location.reload()">
      Try Again
    </button>

    <div class="features">
      <h2>While You're Offline:</h2>
      <ul class="feature-list">
        <li>Previously visited pages are still accessible</li>
        <li>Cached images and assets will load</li>
        <li>Your progress is saved locally</li>
      </ul>
    </div>
  </div>

  <script>
    // Auto-retry when connection is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });

    // Check connection status
    if (navigator.onLine) {
      window.location.reload();
    }
  </script>
</body>
</html>
