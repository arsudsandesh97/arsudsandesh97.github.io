name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate data from Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run generate-json

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_PROFILE_JSON_URL: ${{ secrets.NEXT_PUBLIC_PROFILE_JSON_URL }}
          NEXT_PUBLIC_PROJECTS_JSON_URL: ${{ secrets.NEXT_PUBLIC_PROJECTS_JSON_URL }}
          NEXT_PUBLIC_SKILLS_JSON_URL: ${{ secrets.NEXT_PUBLIC_SKILLS_JSON_URL }}
          NEXT_PUBLIC_EXPERIENCE_JSON_URL: ${{ secrets.NEXT_PUBLIC_EXPERIENCE_JSON_URL }}
          NEXT_PUBLIC_EDUCATION_JSON_URL: ${{ secrets.NEXT_PUBLIC_EDUCATION_JSON_URL }}
          NEXT_PUBLIC_PROJECT_EXPLANATIONS_JSON_URL: ${{ secrets.NEXT_PUBLIC_PROJECT_EXPLANATIONS_JSON_URL }}
          NEXT_PUBLIC_BLOGS_JSON_URL: ${{ secrets.NEXT_PUBLIC_BLOGS_JSON_URL }}
        run: npm run build

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci
