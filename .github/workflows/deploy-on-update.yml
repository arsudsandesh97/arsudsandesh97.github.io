name: Deploy on Supabase Update

on:
  # Manual trigger
  workflow_dispatch:
  
  # Webhook trigger from Supabase
  repository_dispatch:
    types: [supabase-update]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate fresh JSON from Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run generate-json
      
      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_PROFILE_JSON_URL: ${{ secrets.NEXT_PUBLIC_PROFILE_JSON_URL }}
          NEXT_PUBLIC_PROJECTS_JSON_URL: ${{ secrets.NEXT_PUBLIC_PROJECTS_JSON_URL }}
          NEXT_PUBLIC_SKILLS_JSON_URL: ${{ secrets.NEXT_PUBLIC_SKILLS_JSON_URL }}
          NEXT_PUBLIC_EXPERIENCE_JSON_URL: ${{ secrets.NEXT_PUBLIC_EXPERIENCE_JSON_URL }}
          NEXT_PUBLIC_EDUCATION_JSON_URL: ${{ secrets.NEXT_PUBLIC_EDUCATION_JSON_URL }}
          NEXT_PUBLIC_PROJECT_EXPLANATIONS_JSON_URL: ${{ secrets.NEXT_PUBLIC_PROJECT_EXPLANATIONS_JSON_URL }}
          NEXT_PUBLIC_BLOGS_JSON_URL: ${{ secrets.NEXT_PUBLIC_BLOGS_JSON_URL }}
        run: npm run build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
