name: Deploy on Supabase Update

on:
  # Manual trigger
  workflow_dispatch:
  
  # Webhook trigger from Supabase
  repository_dispatch:
    types: [supabase-update]

# Cancel any in-progress deployment to prevent conflicts
concurrency:
  group: pages
  cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate fresh JSON from Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run generate-json
      
      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_PROFILE_JSON_URL: ${{ secrets.NEXT_PUBLIC_PROFILE_JSON_URL }}
          NEXT_PUBLIC_PROJECTS_JSON_URL: ${{ secrets.NEXT_PUBLIC_PROJECTS_JSON_URL }}
          NEXT_PUBLIC_SKILLS_JSON_URL: ${{ secrets.NEXT_PUBLIC_SKILLS_JSON_URL }}
          NEXT_PUBLIC_EXPERIENCE_JSON_URL: ${{ secrets.NEXT_PUBLIC_EXPERIENCE_JSON_URL }}
          NEXT_PUBLIC_EDUCATION_JSON_URL: ${{ secrets.NEXT_PUBLIC_EDUCATION_JSON_URL }}
          NEXT_PUBLIC_PROJECT_EXPLANATIONS_JSON_URL: ${{ secrets.NEXT_PUBLIC_PROJECT_EXPLANATIONS_JSON_URL }}
          NEXT_PUBLIC_BLOGS_JSON_URL: ${{ secrets.NEXT_PUBLIC_BLOGS_JSON_URL }}
        run: npm run build
      
      - name: Create .nojekyll file
        run: touch ./out/.nojekyll
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
